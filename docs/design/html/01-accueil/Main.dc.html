<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sourates</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&amp;display=swap">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; box-sizing: border-box; padding-top: 96px; background: #F2F2F7; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<h1 style="margin: 0; padding: 0 16px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.3px">Sourates</h1>

<section aria-label="Historique d'écoute" style="margin-top: 20px">
<h2 style="margin: 0; padding: 0 20px 6px; font-size: 17px; line-height: 22px; font-weight: 600">Récemment</h2>
<div style="display: flex; align-items: stretch; gap: 16px; padding: 0 20px; overflow-x: auto; white-space: nowrap">
<a href="Pratique.dc.html" style="flex: none; display: flex; flex-direction: column; gap: 2px; padding: 6px 0; text-decoration: none; color: #000000">
<span style="font-size: 17px; line-height: 22px"><span style="font-weight: 600">Ayat al-Kursî</span> · Morceaux 2 → 4</span>
<span style="font-size: 15px; line-height: 20px; color: #6E6E73">il y a 6 h</span>
</a>
<div aria-hidden="true" style="flex: none; width: 1px; margin: 8px 0; background: #D1D1D6"></div>
<a href="Fiche-sourate.dc.html" style="flex: none; display: flex; flex-direction: column; gap: 2px; padding: 6px 0; text-decoration: none; color: #000000">
<span style="font-size: 17px; line-height: 22px"><span style="font-weight: 600">Al-Ikhlâs</span> · Sourate entière</span>
<span style="font-size: 15px; line-height: 20px; color: #6E6E73">hier</span>
</a>
<div aria-hidden="true" style="flex: none; width: 1px; margin: 8px 0; background: #D1D1D6"></div>
<button type="button" style="flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 6px 0; border: 0; background: none; font: inherit; color: #000000; text-align: left; cursor: pointer">
<span style="font-size: 17px; line-height: 22px"><span style="font-weight: 600">An-Nâs</span> · Morceau 3</span>
<span style="font-size: 15px; line-height: 20px; color: #6E6E73">il y a 3 j</span>
</button>
</div>
</section>

<section aria-label="Versets" style="margin-top: 28px">
<h2 style="margin: 0; padding: 0 20px 8px; font-size: 17px; line-height: 22px; font-weight: 600">Versets</h2>
<div style="margin: 0 16px; background: #FFFFFF; border-radius: 12px; overflow: hidden">
<a href="Pratique.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; box-sizing: border-box; text-decoration: none; color: #000000">
<span style="width: 28px; flex: none"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 17px; line-height: 22px">Ayat al-Kursî</span>
<span style="font-size: 15px; line-height: 20px; color: #6E6E73">Al-Baqara 255</span>
</span>
<span lang="ar" dir="rtl" style="font-family: 'KFGQPC Uthmanic Script HAFS', 'Amiri Quran', serif; font-size: 22px; line-height: 36px">آية الكرسي</span>
</a>
</div>
</section>

<section aria-label="Juz ‘Amma" style="margin-top: 28px">
<h2 style="margin: 0; padding: 0 20px 8px; font-size: 17px; line-height: 22px; font-weight: 600">Juz ‘Amma</h2>
<div style="margin: 0 16px; background: #FFFFFF; border-radius: 12px; overflow: hidden">
<sc-for list="{{surahs}}" as="s" hint-placeholder-count="15">
<button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 16px; box-sizing: border-box; border: 0; background: none; font: inherit; color: #000000; text-align: left; cursor: pointer">
<span style="width: 28px; flex: none; font-size: 15px; line-height: 20px; color: #6E6E73; font-variant-numeric: tabular-nums">{{s.n}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 17px; line-height: 22px">{{s.name}}</span>
<span style="font-size: 15px; line-height: 20px; color: #6E6E73">{{s.vt}}</span>
</span>
<span lang="ar" dir="rtl" style="font-family: 'KFGQPC Uthmanic Script HAFS', 'Amiri Quran', serif; font-size: 22px; line-height: 36px">{{s.ar}}</span>
</button>
<sc-if value="{{s.sep}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="height: 1px; margin-left: 56px; background: #E5E5EA"></div>
</sc-if>
</sc-for>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      [100, 'Al-‘Âdiyât', 11, 'العاديات'],
      [101, 'Al-Qâri‘a', 11, 'القارعة'],
      [102, 'At-Takâthur', 8, 'التكاثر'],
      [103, 'Al-‘Asr', 3, 'العصر'],
      [104, 'Al-Humaza', 9, 'الهمزة'],
      [105, 'Al-Fîl', 5, 'الفيل'],
      [106, 'Quraysh', 4, 'قريش'],
      [107, 'Al-Mâ‘ûn', 7, 'الماعون'],
      [108, 'Al-Kawthar', 3, 'الكوثر'],
      [109, 'Al-Kâfirûn', 6, 'الكافرون'],
      [110, 'An-Nasr', 3, 'النصر'],
      [111, 'Al-Masad', 5, 'المسد'],
      [112, 'Al-Ikhlâs', 4, 'الإخلاص'],
      [113, 'Al-Falaq', 5, 'الفلق'],
      [114, 'An-Nâs', 6, 'الناس']
    ];
    return {
      surahs: data.map(function (d, i) {
        return { n: String(d[0]), name: d[1], vt: d[2] + ' versets', ar: d[3], sep: i < data.length - 1 };
      })
    };
  }
}
</script>
</body>
</html>
